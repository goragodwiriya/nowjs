<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .text { font: bold 16px Arial, sans-serif; fill: #fff; }
    .small-text { font: normal 12px Arial, sans-serif; fill: #fff; }
  </style>
  <circle cx="100" cy="100" r="95" fill="#0055B8" />
  <circle cx="100" cy="100" r="85" fill="#004795" />

  <!-- Book Symbol -->
  <path d="M65,70 L135,70 L135,130 L65,130 L65,70 Z" fill="#fff" />
  <path d="M65,70 L100,90 L135,70" fill="none" stroke="#004795" stroke-width="3" />
  <path d="M100,90 L100,130" fill="none" stroke="#004795" stroke-width="3" />

  <!-- Decorative element -->
  <path d="M55,60 L145,60 L145,140 L55,140 Z" fill="none" stroke="#fff" stroke-width="2" />

  <!-- Thai style ornament -->
  <path d="M75,50 C80,45 90,45 95,50 C100,45 110,45 115,50 C120,45 130,45 135,50" fill="none" stroke="#fff" stroke-width="2" />
  <path d="M75,150 C80,155 90,155 95,150 C100,155 110,155 115,150 C120,155 130,155 135,150" fill="none" stroke="#fff" stroke-width="2" />

  <!-- School name -->
  <text x="100" y="170" text-anchor="middle" class="text">โรงเรียนต้นแบบแห่งการเรียนรู้</text>
  <text x="100" y="185" text-anchor="middle" class="small-text">Excellence in Education</text>
